# Blueprint do Render: um serviço web (Django) e um Postgres.
# No painel: Blueprints > New Blueprint Instance > escolha este repositório.
#
# Os planos "free" servem para testar. Para o evento, troque os dois para um
# plano pago: o web gratuito hiberna sem acesso e o Postgres gratuito expira.

databases:
  - name: certel-game-db
    plan: free
    databaseName: certel_game
    user: certel_game

services:
  - type: web
    name: certel-game
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60
    healthCheckPath: /healthz/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        fromDatabase:
          name: certel-game-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      # O painel pede estes dois valores ao criar o Blueprint.
      - key: TOTENS_SENHA
        sync: false
      - key: ADMIN_SENHA
        sync: false
      - key: ADMIN_USUARIO
        value: admin
      - key: TOTENS_QUANTIDADE
        value: 3
