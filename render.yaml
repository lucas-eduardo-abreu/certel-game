# Blueprint do Render: um serviço web (Django) e um Postgres.
# No painel: Blueprints > New Blueprint Instance > escolha este repositório.
#
# Planos pagos mais baratos: o web "starter" (US$ 7/mês) não hiberna e o
# Postgres "basic-256mb" (US$ 6/mês + US$ 0,30/GB) não expira, ao contrário
# dos gratuitos. Virginia é a região do Render mais próxima do Brasil; o web e
# o banco precisam ficar na mesma região.

databases:
  - name: certel-game-db
    plan: basic-256mb
    diskSizeGB: 1
    region: virginia
    databaseName: certel_game
    user: certel_game

services:
  - type: web
    name: certel-game
    runtime: python
    plan: starter
    region: virginia
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60
    healthCheckPath: /healthz/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        fromDatabase:
          name: certel-game-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      # O painel pede estes três valores ao criar o Blueprint.
      - key: TOTENS_SENHA
        sync: false
      - key: RANKING_SENHA
        sync: false
      - key: ADMIN_SENHA
        sync: false
      - key: ADMIN_USUARIO
        value: admin
      - key: TOTENS_QUANTIDADE
        value: 3
